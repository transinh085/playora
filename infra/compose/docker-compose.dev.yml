name: playora-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: playora
      POSTGRES_PASSWORD: playora
      POSTGRES_DB: playora
    ports: ["${PLAYORA_PG_PORT:-54329}:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playora"]
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["${PLAYORA_REDIS_PORT:-63799}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: playora
      MINIO_ROOT_PASSWORD: playora123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pg: {}
  minio: {}
